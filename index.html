<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balcão Forja Geek</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 320'%3E%3Crect width='320' height='320' rx='70' fill='%23FACC15'/%3E%3Cg transform='rotate(-8 160 160)'%3E%3Cpath d='M160 34 L262 92 L266 214 L164 280 L58 220 L54 96 Z' fill='%23DC2626' stroke='%231F1712' stroke-width='20'/%3E%3Cpath d='M160 96 L222 206 L100 206 Z' fill='none' stroke='%23FACC15' stroke-width='30'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root{ --papel:#fbf3e4; --papel2:#f3e5c9; --tinta:#1f1712; --amarelo:#facc15;
         --vermelho:#dc2626; --verde:#16a34a; }
  *{box-sizing:border-box; margin:0}
  body{ background:var(--papel); color:var(--tinta); min-height:100vh;
        font-family:"Space Grotesk",system-ui,sans-serif; padding-bottom:120px }
  header{ background:var(--tinta); color:var(--papel); padding:12px 16px;
          position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px }
  header .logo{ width:36px; height:36px; flex:none }
  header h1{ font-family:Bangers,cursive; font-weight:400; font-size:24px;
             color:var(--amarelo); letter-spacing:1px }
  header small{ margin-left:auto; font-size:11px; opacity:.8; text-align:right }
  .wrap{ max-width:560px; margin:0 auto; padding:14px }
  .placar{ background:var(--amarelo); border:3px solid var(--tinta); border-radius:14px;
           box-shadow:5px 5px 0 var(--tinta); padding:12px 16px; margin-bottom:12px;
           display:flex; justify-content:space-between; align-items:center }
  .placar b{ font-family:Bangers,cursive; font-weight:400; font-size:26px }
  .placar span{ font-size:13px }
  .busca{ width:100%; padding:13px 15px; font-size:16px; border:3px solid var(--tinta);
          border-radius:12px; background:#fff; margin-bottom:12px; font-family:inherit }
  .secao{ font-family:Bangers,cursive; font-size:22px; margin:16px 2px 10px;
          letter-spacing:1px }
  .item{ background:#fff; border:3px solid var(--tinta); border-radius:14px;
         box-shadow:5px 5px 0 var(--tinta); padding:11px 13px; margin-bottom:12px;
         display:flex; align-items:center; gap:11px }
  .item.zerado{ opacity:.55; background:var(--papel2) }
  .foto{ width:56px; height:56px; border-radius:10px; border:2px solid var(--tinta);
         object-fit:cover; background:var(--papel2); flex:none;
         display:flex; align-items:center; justify-content:center; font-size:26px }
  .info{ flex:1; min-width:0 }
  .nome{ font-weight:700; font-size:15px; line-height:1.25 }
  .sub{ font-size:13px; margin-top:2px; color:#6b5d4f }
  .sub b{ color:var(--tinta) }
  .qtd{ background:var(--tinta); color:var(--amarelo); border-radius:10px;
        min-width:50px; text-align:center; padding:6px 5px; font-family:Bangers,cursive;
        font-size:21px; flex:none }
  .qtd small{ display:block; font-family:"Space Grotesk"; font-size:9px; color:var(--papel) }
  .vendi{ background:var(--vermelho); color:#fff; border:3px solid var(--tinta);
          border-radius:12px; padding:11px 12px; font-family:Bangers,cursive;
          font-size:18px; letter-spacing:1px; flex:none; cursor:pointer;
          box-shadow:3px 3px 0 var(--tinta) }
  .vendi:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--tinta) }
  .vendi:disabled{ background:#9b8b73; cursor:default }
  .inv-botoes{ display:flex; flex-direction:column; gap:6px; flex:none }
  .inv-botoes button{ width:44px; height:32px; border:2.5px solid var(--tinta);
        border-radius:9px; font-size:18px; font-weight:700; cursor:pointer;
        font-family:inherit }
  .mais{ background:var(--verde); color:#fff }
  .menos{ background:var(--vermelho); color:#fff }
  .editar{ background:var(--papel2) }
  .venda-linha{ background:#fff; border:2.5px solid var(--tinta); border-radius:12px;
        padding:9px 13px; margin-bottom:8px; display:flex; align-items:center; gap:10px;
        font-size:14px; flex-wrap:wrap }
  .venda-linha .hora{ color:#6b5d4f; font-size:12px }
  .devolver{ margin-left:auto; background:var(--amarelo); border:2.5px solid var(--tinta);
        border-radius:9px; padding:7px 11px; font-weight:700; cursor:pointer;
        font-family:inherit; font-size:13px }
  .rodape-fixo{ position:fixed; left:0; right:0; bottom:0; background:var(--tinta);
        padding:10px 14px; display:flex; gap:10px; justify-content:center; z-index:6 }
  .rodape-fixo button{ font-family:Bangers,cursive; font-size:17px; letter-spacing:1px;
        border:2.5px solid var(--amarelo); background:none; color:var(--amarelo);
        border-radius:11px; padding:9px 16px; cursor:pointer }
  .rodape-fixo button.on{ background:var(--amarelo); color:var(--tinta) }
  .toast{ position:fixed; left:50%; bottom:70px; transform:translateX(-50%);
          background:var(--tinta); color:var(--papel); border-radius:14px;
          padding:12px 16px; display:none; z-index:9; width:min(520px,94vw);
          align-items:center; gap:12px; box-shadow:0 8px 30px rgba(0,0,0,.4) }
  .toast.on{ display:flex }
  .toast b{ color:var(--amarelo) }
  .toast button{ margin-left:auto; background:var(--amarelo); border:0; color:var(--tinta);
                 font-weight:700; border-radius:9px; padding:8px 12px; cursor:pointer;
                 font-family:inherit; font-size:14px }
  .aviso{ text-align:center; padding:40px 20px; font-size:15px; line-height:1.6 }
  .vazio{ text-align:center; padding:24px; color:#6b5d4f }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 320 320"><rect width="320" height="320" rx="70" fill="#FACC15"/><g transform="rotate(-8 160 160) scale(0.94) translate(10 10)" stroke-linejoin="round" stroke-linecap="round"><path d="M160 34 L262 92 L266 214 L164 280 L58 220 L54 96 Z" fill="#DC2626" stroke="#1F1712" stroke-width="20"/><path d="M160 96 L222 206 L100 206 Z" fill="none" stroke="#FACC15" stroke-width="30"/></g></svg>
  <h1>BALCÃO FORJA GEEK</h1>
  <small>toca em VENDI<br>quando sair uma peça</small>
</header>

<div class="wrap">
  <div class="placar">
    <div><b id="hoje">R$ 0</b><br><span>vendido hoje</span></div>
    <div style="text-align:right"><b id="pecas-hoje">0</b><br><span>peças hoje</span></div>
  </div>
  <input class="busca" id="busca" placeholder="🔍 procurar peça…" autocomplete="off">
  <div id="lista"><div class="aviso">Carregando o estoque… ⚒️</div></div>

  <div class="secao">📋 VENDAS DE HOJE</div>
  <div id="vendas-hoje"><div class="vazio">nenhuma venda hoje ainda</div></div>

  <div class="secao">🧵 FILAMENTOS (rolos)</div>
  <div id="filamentos"><div class="vazio">nenhum rolo cadastrado — usa o modo inventário</div></div>
</div>

<div class="rodape-fixo">
  <button id="modo-inv">🔧 INVENTÁRIO</button>
  <button id="add-item" style="display:none">➕ PEÇA</button>
  <button id="add-fil" style="display:none">🧵 ROLO</button>
</div>

<div class="toast" id="toast">
  <div id="toast-txt"></div>
  <button id="desfazer">DESFAZER</button>
</div>

<script>
const FOTOS = {};
const SB = supabase.createClient("https://hzabcdvskjwmnabrsbev.supabase.co", "sb_publishable_7R1jbsmt8HAFrAQD0pxR0w_1Sr0q-SP");
const fmt = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
let ITENS = {}, FIL = {}, VENDAS = [], ultimaVenda = null, toastTimer = null;
let INVENTARIO = false;

function toast(msg) {
  document.getElementById("toast-txt").innerHTML = msg;
  const t = document.getElementById("toast");
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 8000);
}
const erro = () => toast("⚠️ Não salvou — confere a internet e tenta de novo");

async function refetch() {
  const [i, f, v] = await Promise.all([
    SB.from("balcao_itens").select("*"),
    SB.from("balcao_filamentos").select("*"),
    SB.from("balcao_vendas").select("*").order("quando", { ascending: false }).limit(200),
  ]);
  if (i.error || f.error || v.error) {
    document.getElementById("lista").innerHTML =
      '<div class="aviso">⚠️ Não consegui falar com o estoque.<br>Confere a internet e recarrega a página.</div>';
    return;
  }
  ITENS = {}; i.data.forEach(r => ITENS[r.id] = r);
  FIL = {}; f.data.forEach(r => FIL[r.id] = r);
  VENDAS = v.data;
  render(); renderVendas(); renderFil();
}

function render() {
  const busca = (document.getElementById("busca").value || "").toLowerCase();
  const lista = document.getElementById("lista");
  const ids = Object.keys(ITENS)
    .filter(id => !busca || ITENS[id].nome.toLowerCase().includes(busca))
    .sort((a, b) => (ITENS[b].qtd > 0) - (ITENS[a].qtd > 0)
                    || ITENS[a].nome.localeCompare(ITENS[b].nome));
  if (!ids.length) {
    lista.innerHTML = '<div class="vazio">nada com esse nome 🌵</div>';
    return;
  }
  lista.innerHTML = ids.map(id => {
    const it = ITENS[id];
    const zerado = it.qtd <= 0;
    const foto = FOTOS[id] || it.foto;
    const fotoHtml = foto ? `<img class="foto" src="${foto}" alt="">`
                          : `<div class="foto">🧩</div>`;
    const acao = INVENTARIO
      ? `<div class="inv-botoes">
           <button class="mais" data-id="${id}" data-op="mais">+</button>
           <button class="menos" data-id="${id}" data-op="menos">−</button>
           <button class="editar" data-id="${id}" data-op="editar">✏️</button>
           <button class="editar" data-id="${id}" data-op="tirar">🗑️</button>
         </div>`
      : `<button class="vendi" data-id="${id}" ${zerado ? "disabled" : ""}>
           ${zerado ? "ESGOTOU" : "VENDI 1"}</button>`;
    return `<div class="item ${zerado ? "zerado" : ""}">
      ${fotoHtml}
      <div class="qtd">${it.qtd}<small>restam</small></div>
      <div class="info">
        <div class="nome">${it.nome}</div>
        <div class="sub">preço: <b>${fmt(it.preco)}</b></div>
      </div>
      ${acao}
    </div>`;
  }).join("");
}

function ehHoje(iso) {
  if (!iso) return false;
  const d = new Date(iso), h = new Date();
  return d.getFullYear() === h.getFullYear() && d.getMonth() === h.getMonth()
      && d.getDate() === h.getDate();
}

function renderVendas() {
  const box = document.getElementById("vendas-hoje");
  const hoje = VENDAS.filter(v => ehHoje(v.quando));
  let total = 0;
  hoje.forEach(v => total += Number(v.preco || 0));
  document.getElementById("hoje").textContent = fmt(total);
  document.getElementById("pecas-hoje").textContent = hoje.length;
  if (!hoje.length) {
    box.innerHTML = '<div class="vazio">nenhuma venda hoje ainda</div>';
    return;
  }
  box.innerHTML = hoje.map(v => {
    const h = new Date(v.quando);
    const hh = String(h.getHours()).padStart(2, "0") + ":" +
               String(h.getMinutes()).padStart(2, "0");
    return `<div class="venda-linha">
      <span class="hora">${hh}</span>
      <span>${v.nome} — <b>${fmt(v.preco)}</b></span>
      <button class="devolver" data-vid="${v.id}">DEVOLVER</button>
    </div>`;
  }).join("");
}

function renderFil() {
  const box = document.getElementById("filamentos");
  const ids = Object.keys(FIL).sort((a, b) => FIL[a].nome.localeCompare(FIL[b].nome));
  if (!ids.length) {
    box.innerHTML = '<div class="vazio">nenhum rolo cadastrado — usa o modo inventário</div>';
    return;
  }
  let totalFil = 0;
  box.innerHTML = ids.map(id => {
    const f = FIL[id];
    totalFil += f.qtd * Number(f.preco || 120);
    const acao = INVENTARIO
      ? `<span style="display:flex; gap:6px">
           <button class="devolver" data-fid="${id}" data-op="fmais">+1</button>
           <button class="devolver" data-fid="${id}" data-op="fmenos">−1</button>
           <button class="devolver" data-fid="${id}" data-op="ftirar">🗑️</button>
         </span>` : "";
    return `<div class="venda-linha">
      <span>🧵 <b>${f.nome}</b></span>
      <span class="hora">${f.qtd} rolo${f.qtd === 1 ? "" : "s"} · ${fmt(f.preco)}/rolo</span>
      ${acao}
    </div>`;
  }).join("") + `<div class="venda-linha" style="background:var(--papel2)">
      <span>💰 investido em filamento:</span>
      <span style="margin-left:auto"><b>${fmt(totalFil)}</b></span>
    </div>`;
}

async function vender(id) {
  const it = ITENS[id];
  if (!it || it.qtd <= 0) return;
  const { data, error } = await SB.from("balcao_vendas")
    .insert({ item_id: id, nome: it.nome, preco: it.preco }).select().single();
  if (error) return erro();
  const up = await SB.from("balcao_itens").update({ qtd: it.qtd - 1 }).eq("id", id);
  if (up.error) return erro();
  ultimaVenda = { vid: data.id, id, qtdAntes: it.qtd };
  toast(`✔ Vendido: <b>${it.nome}</b> — ${fmt(it.preco)}`);
  refetch();
}

async function desfazer() {
  if (!ultimaVenda) return;
  await SB.from("balcao_vendas").delete().eq("id", ultimaVenda.vid);
  await SB.from("balcao_itens").update({ qtd: ultimaVenda.qtdAntes }).eq("id", ultimaVenda.id);
  toast("↩️ Desfeito!");
  ultimaVenda = null;
  refetch();
}

async function devolver(vid) {
  const v = VENDAS.find(x => String(x.id) === String(vid));
  if (!v) return;
  if (!confirm(`Devolver a venda de "${v.nome}"?\nA peça volta pro estoque.`)) return;
  await SB.from("balcao_vendas").delete().eq("id", vid);
  const it = ITENS[v.item_id];
  if (it) await SB.from("balcao_itens").update({ qtd: it.qtd + 1 }).eq("id", v.item_id);
  toast("↩️ Venda devolvida, peça de volta no estoque");
  refetch();
}

async function salvaQtd(id, novo) {
  const r = await SB.from("balcao_itens").update({ qtd: Math.max(0, novo) }).eq("id", id);
  if (r.error) erro(); else refetch();
}

async function editarItem(id) {
  const it = ITENS[id];
  const nome = prompt("Nome da peça:", it.nome);
  if (nome === null) return;
  const preco = prompt("Preço (R$):", it.preco);
  if (preco === null) return;
  const p = parseFloat(String(preco).replace(",", "."));
  const r = await SB.from("balcao_itens").update({
    nome: nome.trim() || it.nome, preco: isNaN(p) ? it.preco : p }).eq("id", id);
  if (r.error) erro(); else { toast("✏️ Salvo!"); refetch(); }
}

async function novaPeca() {
  const nome = prompt("Nome da peça nova:");
  if (!nome || !nome.trim()) return;
  const qtd = parseInt(prompt("Quantas unidades tem?", "1")) || 1;
  const p = parseFloat(String(prompt("Preço (R$):", "15")).replace(",", ".")) || 15;
  const id = "novo-" + nome.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 30)
             + "-" + Date.now().toString(36);
  const r = await SB.from("balcao_itens").insert({ id, nome: nome.trim(), qtd, preco: p });
  if (r.error) erro(); else { toast(`➕ <b>${nome.trim()}</b> no estoque!`); refetch(); }
}

async function novoFilamento() {
  const nome = prompt("Filamento (cor e marca):", "PLA Preto");
  if (!nome || !nome.trim()) return;
  const qtd = parseInt(prompt("Quantos rolos?", "1")) || 1;
  const preco = parseFloat(String(
    prompt("Quanto pagou por rolo? (R$)", "120")).replace(",", ".")) || 120;
  const id = "fil-" + nome.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 30);
  const r = await SB.from("balcao_filamentos").upsert({ id, nome: nome.trim(), qtd, preco });
  if (r.error) erro(); else { toast(`🧵 <b>${nome.trim()}</b>: ${qtd} rolo(s)`); refetch(); }
}

document.getElementById("lista").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  const id = b.dataset.id;
  if (b.classList.contains("vendi") && !b.disabled) vender(id);
  else if (b.dataset.op === "mais") salvaQtd(id, ITENS[id].qtd + 1);
  else if (b.dataset.op === "menos") {
    if (ITENS[id].qtd <= 0) return;
    const vendeu = confirm(`Essa unidade de "${ITENS[id].nome}" que falta FOI VENDIDA?

OK = foi vendida (entra no faturamento de hoje)
Cancelar = só tirar do estoque (perda/presente/uso)`);
    if (vendeu) vender(id); else salvaQtd(id, ITENS[id].qtd - 1);
  }
  else if (b.dataset.op === "editar") editarItem(id);
  else if (b.dataset.op === "tirar") {
    if (confirm(`Tirar "${ITENS[id].nome}" do balcão?\n(só sai daqui, não mexe no controle de gastos)`))
      SB.from("balcao_itens").delete().eq("id", id)
        .then(() => { toast("🗑️ Tirado do balcão"); refetch(); });
  }
});
document.getElementById("vendas-hoje").addEventListener("click", ev => {
  const b = ev.target.closest("button.devolver");
  if (b && b.dataset.vid) devolver(b.dataset.vid);
});
document.getElementById("filamentos").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || !b.dataset.fid) return;
  const id = b.dataset.fid, f = FIL[id];
  if (b.dataset.op === "fmais")
    SB.from("balcao_filamentos").update({ qtd: f.qtd + 1 }).eq("id", id).then(refetch);
  else if (b.dataset.op === "fmenos")
    SB.from("balcao_filamentos").update({ qtd: Math.max(0, f.qtd - 1) }).eq("id", id).then(refetch);
  else if (b.dataset.op === "ftirar") {
    if (confirm(`Tirar o filamento "${f.nome}" da lista?`))
      SB.from("balcao_filamentos").delete().eq("id", id).then(refetch);
  }
});
document.getElementById("busca").addEventListener("input", render);
document.getElementById("desfazer").addEventListener("click", desfazer);
document.getElementById("modo-inv").addEventListener("click", () => {
  INVENTARIO = !INVENTARIO;
  document.getElementById("modo-inv").classList.toggle("on", INVENTARIO);
  document.getElementById("add-item").style.display = INVENTARIO ? "" : "none";
  document.getElementById("add-fil").style.display = INVENTARIO ? "" : "none";
  render(); renderFil();
});
document.getElementById("add-item").addEventListener("click", novaPeca);
document.getElementById("add-fil").addEventListener("click", novoFilamento);

refetch();
setInterval(refetch, 12000);
</script>
</body>
</html>
